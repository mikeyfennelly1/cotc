nameOverride: ""
fullnameOverride: ""

nats:
  image:
    repository: nats
    tag: "2.12.3-alpine3.22"
    pullPolicy: IfNotPresent
  port: 4222
  monitoringPort: 8222
  resources: {}

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  database: "web-app"
  user: "mikey"
  # Override with --set postgres.password=<value> or an external secret
  password: "changeme"
  storage: "5Gi"
  storageClassName: ""
  resources: {}

cotccollector:
  image:
    repository: mikeyfennelly/cotccollector
    tag: "2.3.0"
    pullPolicy: IfNotPresent
  port: 8080
  logLevel: "INFO"
  replicaCount: 1
  resources: {}

cotcsubscriber:
  image:
    repository: mikeyfennelly/cotcsubscriber
    tag: "2.5.5"
    pullPolicy: IfNotPresent
  port: 8080
  replicaCount: 1
  # Base64-encoded Google service account JSON.
  # Supply at install time:  --set cotcsubscriber.googleServiceAccountJson=$(base64 -w0 serviceAccount.json)
  googleServiceAccountJson: ""
  resources: {}

cotcgui:
  image:
    repository: mikeyfennelly/cotcgui
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  port: 8080
  replicaCount: 1
  # Public URL the browser uses to reach the API gateway
  apiBaseUrl: "http://localhost:8080"
  resources: {}

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  # Number of pending JetStream messages per replica that triggers a scale-up.
  lagThreshold: "100"
  # Backlog must exceed this before scaling away from zero (only relevant when minReplicaCount: 0).
  activationLagThreshold: "1"
  pollingInterval: 15   # seconds
  cooldownPeriod: 60    # seconds

apiGateway:
  image:
    repository: nginx
    tag: "1.28-alpine3.23"
    pullPolicy: IfNotPresent
  port: 8080
  replicaCount: 1
  service:
    type: LoadBalancer
    # nodePort: 30080   # uncomment when type=NodePort
  ingress:
    enabled: false
    className: ""       # e.g. "nginx"
    host: ""            # e.g. "api.cotc.local"
    annotations: {}
    # annotations:
    #   kubernetes.io/ingress.class: nginx
  resources: {}
